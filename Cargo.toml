[package]
name = "diffier"
version = "0.1.0"
edition = "2024"
description = "Live diff feed for Claude Code edits, fed by hooks, rendered with delta"
license = "MIT"
readme = "README.md"
repository = "https://github.com/spencerjireh/diffier"
homepage = "https://github.com/spencerjireh/diffier"
keywords = ["claude-code", "diff", "tui", "hooks", "delta"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.89"

[[bin]]
name = "diffier"
path = "src/main.rs"

[lib]
name = "diffier"
path = "src/lib.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
ansi-to-tui = "8"
similar = "3"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
